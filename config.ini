[TELEGRAM]
bot_token = your bot token here
chat_id = setup your telegram ID

[MARKET]
exchange_id = bybit
market_type = swap
timeframe = 15m
top_coins = 100

[RADAR]
scan_interval = 600
alert_cooldown = 14400
ppas_jump_trigger = 10
risk_threshold_high = 92
risk_threshold_safe = 82

# v3.6 — New Options
; How many coins to scan per cycle (top by volume)
top_scan_coins = 100
; Enable Multi-Timeframe confirmation (1h + 4h bias filter)
mtf_enabled = true
; Shorten cooldown automatically during high-volatility market regimes
adaptive_cooldown = true

[DATA_FETCH]
market_db = Venus_Market_Data.db
result_db = venus_historical.db
concurrency_limit = 36
fetch_limit = 8640

[MACHINE_LEARNING]
global_model_path = ml_enhancements/ppas_global_model.pkl
per_coin_models_dir = ml_enhancements/models/
future_window = 12
risk_sigma_threshold = 3.0
n_estimators = 150
max_depth = 12
n_jobs = -1
min_samples_per_coin = 2000

[MLOPS]
predictions_db = Venus_Predictions.db
market_heat_threshold = 30
; Daily Recap hour in GMT+7 (7 = 07:00 GMT+7)
recap_hour_gmt7 = 7
